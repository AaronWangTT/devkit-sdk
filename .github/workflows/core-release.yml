name: Core release
run-name: Release Core ${{ inputs.version }} (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing numeric semantic-version tag to publish (for example, 2.0.3)
        required: true
        type: string

concurrency:
  group: core-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish Core release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manual release request
        id: release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/maintenance") {
            throw "Run this workflow from the maintenance branch. Received $env:GITHUB_REF."
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must be a numeric semantic version such as 2.0.3."
          }

          $tagRef = "refs/tags/$env:RELEASE_VERSION"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:RELEASE_VERSION does not exist. Create and push it before dispatching this workflow."
          }

          $tagCommit = (git rev-parse "$tagRef^{commit}").Trim()
          git merge-base --is-ancestor $tagCommit origin/maintenance
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:RELEASE_VERSION is not on the maintenance branch."
          }

          git checkout --detach $tagCommit
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out release tag $env:RELEASE_VERSION."
          }
          "tag_commit=$tagCommit" >> $env:GITHUB_OUTPUT

      - name: Build and verify tagged package
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
        run: |
          $packageVerifier = "./tools/package/Test-Az3166BoardPackage.ps1"
          if (-not (Test-Path -LiteralPath $packageVerifier -PathType Leaf)) {
            $packageVerifier = "./tools/Test-Az3166BoardPackage.ps1"
          }
          $result = & $packageVerifier `
            -Revision $env:TAG_COMMIT `
            -ExpectedVersion $env:RELEASE_VERSION `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "package")
          "path=$($result.Path)" >> $env:GITHUB_OUTPUT
          "sha256=$($result.SHA256)" >> $env:GITHUB_OUTPUT
          "version=$($result.Version)" >> $env:GITHUB_OUTPUT
          $result | Format-List

      - name: Verify runtime version API
        shell: bash
        run: |
          set -euo pipefail
          platform_source=src
          if [[ ! -d "$platform_source" ]]; then
            platform_source=AZ3166/src
          fi
          test_source=tests/host/core/SystemVersionTest.cpp
          if [[ ! -f "$test_source" ]]; then
            test_source=tools/SystemVersionTest.cpp
          fi
          g++ -std=c++11 \
            -include cstdint \
            -I "$platform_source/cores/arduino/system" \
            "$platform_source/cores/arduino/system/SystemVersion.cpp" \
            "$test_source" \
            -o "$RUNNER_TEMP/system-version-test"
          "$RUNNER_TEMP/system-version-test" "${{ steps.package.outputs.version }}"

      - name: Run WiFiUDP host tests
        if: hashFiles('tests/host/wifi/WiFiUdpTest.cpp', 'AZ3166/tests/WiFiTest/WiFiUdpTest.cpp') != ''
        shell: bash
        run: |
          set -euo pipefail
          platform_source=src
          if [[ ! -d "$platform_source" ]]; then
            platform_source=AZ3166/src
          fi
          test_source=tests/host/wifi/WiFiUdpTest.cpp
          if [[ ! -f "$test_source" ]]; then
            test_source=AZ3166/tests/WiFiTest/WiFiUdpTest.cpp
          fi
          g++ -std=c++11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -I "$platform_source/system/mbed-os/features/netsocket" \
            -I "$platform_source/cores/arduino/system" \
            "$test_source" \
            -o "$RUNNER_TEMP/wifiudp-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$RUNNER_TEMP/wifiudp-test"

      - name: Run legacy client host tests
        if: hashFiles('tests/host/cloud/IotClientTest.cpp', 'AZ3166/tests/VoiceToTwitter/IotClientTest.cpp') != ''
        shell: bash
        run: |
          set -euo pipefail
          platform_source=src
          if [[ ! -d "$platform_source" ]]; then
            platform_source=AZ3166/src
          fi
          test_source=tests/host/cloud/IotClientTest.cpp
          if [[ ! -f "$test_source" ]]; then
            test_source=AZ3166/tests/VoiceToTwitter/IotClientTest.cpp
          fi
          g++ -std=gnu++11 -O1 -g -Wall -Wextra -Werror \
            -ffunction-sections -fdata-sections \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I "$platform_source/cores/arduino" \
            -I "$platform_source/cores/arduino/httpclient" \
            -I "$platform_source/system/azure-iot-sdk-c/deps/parson" \
            -I "$platform_source/system/azure-iot-sdk-c/c-utility/inc" \
            "$test_source" \
            -Wl,--gc-sections \
            -o "$RUNNER_TEMP/iot-client-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$RUNNER_TEMP/iot-client-test"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          Maintained AZ3166 Arduino Core release for AaronWangTT/HomeTemperature,
          based on Microsoft's final 2.0.0 release.

          The release tag and getDevkitVersion() both report $env:PACKAGE_VERSION.
          The attached Board Manager archive was generated reproducibly from the
          tagged platform source tree.

          Artifact SHA-256: $env:PACKAGE_SHA256
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM

          gh release create $env:PACKAGE_VERSION $env:PACKAGE_PATH `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "AZ3166 Core $env:PACKAGE_VERSION" `
            --notes-file $notesPath `
            --latest
