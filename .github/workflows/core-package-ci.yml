name: Core package CI

on:
  pull_request:
    branches:
      - maintenance
  push:
    branches:
      - maintenance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Core package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-24.04
            artifact_suffix: ubuntu
          - name: Windows
            runner: windows-2022
            artifact_suffix: windows
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned build configuration
        id: build-lock
        shell: pwsh
        run: |
          . ./tools/build/Az3166Build.Common.ps1
          $lock = Get-Az3166BuildLock
          Export-Az3166BuildLockGitHubOutput `
            -Lock $lock -Path $env:GITHUB_OUTPUT

      - name: Validate build configuration
        shell: pwsh
        run: ./tests/host/build/BuildConfigurationTest.ps1

      - name: Validate package layout contracts
        shell: pwsh
        run: ./tests/host/package/PackageLayoutTest.ps1

      - name: Build and verify deterministic package
        id: package
        shell: pwsh
        env:
          TZ: Pacific/Honolulu
        run: |
          git config core.autocrlf true
          $callerTimezone = $env:TZ
          $result = & ./tools/package/Test-Az3166BoardPackage.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "package")
          if ($env:TZ -ne $callerTimezone) {
            throw "Package builder did not restore the caller timezone."
          }
          if ((git config --get core.autocrlf) -ne "true") {
            throw "Package builder modified the caller Git configuration."
          }
          "path=$($result.Path)" >> $env:GITHUB_OUTPUT
          "sha256=$($result.SHA256)" >> $env:GITHUB_OUTPUT
          "version=$($result.Version)" >> $env:GITHUB_OUTPUT
          $result | Format-List

      - name: Verify canonical Core package
        shell: pwsh
        env:
          TZ: Pacific/Honolulu
          GOLDEN_VERSION: ${{ steps.build-lock.outputs.core_version }}
          GOLDEN_SIZE: ${{ steps.build-lock.outputs.core_package_size }}
          GOLDEN_SHA256: ${{ steps.build-lock.outputs.core_package_sha256 }}
        run: |
          $result = & ./tools/package/Test-Az3166BoardPackage.ps1 `
            -Revision $env:GOLDEN_VERSION `
            -ExpectedVersion $env:GOLDEN_VERSION `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "golden-package")
          if (
            $result.Size -ne [long]$env:GOLDEN_SIZE -or
            $result.SHA256 -ne $env:GOLDEN_SHA256
          ) {
            throw "Canonical $env:GOLDEN_VERSION package mismatch: $($result.Size) bytes, $($result.SHA256)"
          }
          $result | Format-List

      - name: Run Core host tests
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./tools/test/Test-Az3166HostTests.ps1 -Sanitize `
            -ExpectedVersion '${{ steps.package.outputs.version }}'

      - name: Set up Arduino CLI
        if: runner.os == 'Windows'
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ steps.build-lock.outputs.arduino_cli_version }}

      - name: Cache AZ3166 test toolchain
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/a
          key: az3166-test-toolchain-${{ hashFiles('tools/build/az3166-build-lock.json') }}-windows

      - name: Install pinned AZ3166 test toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CORE_VERSION: ${{ steps.build-lock.outputs.core_version }}
          ARDUINO_IDE_VERSION: ${{ steps.build-lock.outputs.arduino_ide_version }}
          ARDUINO_IDE_URL: ${{ steps.build-lock.outputs.arduino_ide_url }}
          ARDUINO_IDE_SIZE: ${{ steps.build-lock.outputs.arduino_ide_size }}
          ARDUINO_IDE_SHA256: ${{ steps.build-lock.outputs.arduino_ide_sha256 }}
          AZ3166_INDEX_URL: ${{ steps.build-lock.outputs.index_url }}
          AZ3166_INDEX_SHA256: ${{ steps.build-lock.outputs.index_sha256 }}
          GCC_PACKAGE_VERSION: ${{ steps.build-lock.outputs.gcc_package_version }}
          GCC_COMPILER_VERSION: ${{ steps.build-lock.outputs.gcc_compiler_version }}
        run: |
          $arduinoRoot = Join-Path $env:RUNNER_TEMP "a"
          $arduino = Join-Path $arduinoRoot "arduino_debug.exe"
          $arduinoData = Join-Path $arduinoRoot "portable"
          $coreRoot = Join-Path $arduinoData "packages/AZ3166/hardware/stm32f4/$env:CORE_VERSION"
          $compilerRoot = Join-Path $arduinoData "packages/AZ3166/tools/arm-none-eabi-gcc/$env:GCC_PACKAGE_VERSION"
          $compiler = Join-Path $compilerRoot "bin/arm-none-eabi-g++.exe"
          $targetHeader = Join-Path $compilerRoot "arm-none-eabi/include/c++/$env:GCC_COMPILER_VERSION/arm-none-eabi/bits/c++config.h"

          if (-not (Test-Path -LiteralPath $arduino -PathType Leaf)) {
            $archive = Join-Path $env:RUNNER_TEMP "arduino-$env:ARDUINO_IDE_VERSION-windows.zip"
            $expandedRoot = Join-Path $env:RUNNER_TEMP "arduino-$env:ARDUINO_IDE_VERSION"
            Remove-Item -LiteralPath $arduinoRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $expandedRoot -Recurse -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest `
              -Uri $env:ARDUINO_IDE_URL `
              -OutFile $archive
            $archiveSize = (Get-Item -LiteralPath $archive).Length
            if ($archiveSize -ne [long]$env:ARDUINO_IDE_SIZE) {
              throw "Arduino IDE archive size mismatch: $archiveSize"
            }
            $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($archiveHash -ne $env:ARDUINO_IDE_SHA256) {
              throw "Arduino IDE archive hash mismatch: $archiveHash"
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
            Move-Item -LiteralPath $expandedRoot -Destination $arduinoRoot
            Remove-Item -LiteralPath $archive -Force
          }

          if (
            -not (Test-Path -LiteralPath (Join-Path $coreRoot "platform.txt") -PathType Leaf) -or
            -not (Test-Path -LiteralPath $compiler -PathType Leaf) -or
            -not (Test-Path -LiteralPath $targetHeader -PathType Leaf)
          ) {
            Remove-Item -LiteralPath (Join-Path $arduinoData "packages/AZ3166") `
              -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $arduinoData -Force | Out-Null
            $indexPath = Join-Path $env:RUNNER_TEMP "package_azureboard_index.json"
            Invoke-WebRequest -Uri $env:AZ3166_INDEX_URL -OutFile $indexPath
            $indexHash = (Get-FileHash -LiteralPath $indexPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($indexHash -ne $env:AZ3166_INDEX_SHA256) {
              throw "AZ3166 Board Manager index hash mismatch: $indexHash"
            }

            $serverId = [guid]::NewGuid().ToString('N')
            $readyEventName = "Az3166IndexServer-$serverId"
            $portPath = Join-Path $env:RUNNER_TEMP "az3166-index-port-$serverId.txt"
            $servedPath = Join-Path $env:RUNNER_TEMP "az3166-index-served-$serverId.txt"
            $readyEvent = [Threading.EventWaitHandle]::new(
              $false,
              [Threading.EventResetMode]::ManualReset,
              $readyEventName
            )
            $indexServer = Start-Job -ArgumentList `
              $indexPath, $portPath, $servedPath, $readyEventName, $indexHash -ScriptBlock {
                param($IndexPath, $PortPath, $ServedPath, $ReadyEventName, $IndexHash)

                $ErrorActionPreference = 'Stop'
                $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
                $ready = [Threading.EventWaitHandle]::OpenExisting($ReadyEventName)
                try {
                  $indexBytes = [IO.File]::ReadAllBytes($IndexPath)
                  $hasher = [Security.Cryptography.SHA256]::Create()
                  try {
                    $servedHash = [BitConverter]::ToString(
                      $hasher.ComputeHash($indexBytes)
                    ).Replace('-', '').ToLowerInvariant()
                  }
                  finally {
                    $hasher.Dispose()
                  }
                  if ($servedHash -ne $IndexHash) {
                    throw "Local AZ3166 index changed before serving: $servedHash"
                  }

                  $listener.Start()
                  $port = ([Net.IPEndPoint]$listener.LocalEndpoint).Port
                  [IO.File]::WriteAllText($PortPath, [string]$port, [Text.Encoding]::ASCII)
                  $null = $ready.Set()
                  $expectedPath = "/$([IO.Path]::GetFileName($IndexPath))"

                  while ($true) {
                    $client = $listener.AcceptTcpClient()
                    try {
                      $stream = $client.GetStream()
                      $reader = [IO.StreamReader]::new(
                        $stream,
                        [Text.Encoding]::ASCII,
                        $false,
                        1024,
                        $true
                      )
                      try {
                        $requestParts = $reader.ReadLine().Split(' ')
                        while ($reader.ReadLine()) {}
                      }
                      finally {
                        $reader.Dispose()
                      }

                      if (
                        $requestParts.Count -ne 3 -or
                        $requestParts[0] -notin @('GET', 'HEAD') -or
                        $requestParts[1] -cne $expectedPath
                      ) {
                        $response = [Text.Encoding]::ASCII.GetBytes(
                          "HTTP/1.1 404 Not Found`r`nContent-Length: 0`r`nConnection: close`r`n`r`n"
                        )
                        $stream.Write($response, 0, $response.Length)
                        throw "Unexpected local index request: $($requestParts -join ' ')"
                      }

                      $header = [Text.Encoding]::ASCII.GetBytes(
                        "HTTP/1.1 200 OK`r`nContent-Type: application/json`r`nContent-Length: $($indexBytes.Length)`r`nConnection: close`r`n`r`n"
                      )
                      $stream.Write($header, 0, $header.Length)
                      if ($requestParts[0] -ceq 'GET') {
                        $stream.Write($indexBytes, 0, $indexBytes.Length)
                        [IO.File]::WriteAllText($ServedPath, $servedHash, [Text.Encoding]::ASCII)
                      }
                      $stream.Flush()
                    }
                    finally {
                      $client.Dispose()
                    }
                  }
                }
                finally {
                  $ready.Dispose()
                  $listener.Stop()
                }
              }

            try {
              if (-not $readyEvent.WaitOne([TimeSpan]::FromSeconds(15))) {
                throw "Timed out starting the verified AZ3166 index server."
              }
              $indexPort = [int][IO.File]::ReadAllText($portPath)
              $verifiedIndexUrl = "http://127.0.0.1:$indexPort/$([IO.Path]::GetFileName($indexPath))"
              & $arduino `
                --install-boards "AZ3166:stm32f4:$env:CORE_VERSION" `
                --pref "boardsmanager.additional.urls=$verifiedIndexUrl"
              $installExitCode = $LASTEXITCODE
              if ($indexServer.State -eq 'Failed') {
                throw "Verified AZ3166 index server failed: $($indexServer.ChildJobs[0].JobStateInfo.Reason.Message)"
              }
              if (-not (Test-Path -LiteralPath $servedPath -PathType Leaf)) {
                throw "Arduino IDE did not request the verified AZ3166 index."
              }
              $servedHash = [IO.File]::ReadAllText($servedPath)
              if ($servedHash -ne $env:AZ3166_INDEX_SHA256) {
                throw "Arduino IDE received an unexpected AZ3166 index: $servedHash"
              }
              if ($installExitCode -ne 0) {
                throw "Failed to install the pinned AZ3166 test toolchain."
              }
            }
            finally {
              if ($indexServer.State -eq 'Running') {
                Stop-Job -Job $indexServer
              }
              Remove-Job -Job $indexServer -Force
              $readyEvent.Dispose()
              Remove-Item -LiteralPath $indexPath, $portPath, $servedPath `
                -Force -ErrorAction SilentlyContinue
            }
          }

          if (
            -not (Test-Path -LiteralPath (Join-Path $coreRoot "platform.txt") -PathType Leaf) -or
            -not (Test-Path -LiteralPath $compiler -PathType Leaf) -or
            -not (Test-Path -LiteralPath $targetHeader -PathType Leaf)
          ) {
            throw "The AZ3166 test toolchain installation is incomplete."
          }

      - name: Compile Arduino test sketches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/test/Test-Az3166Sketches.ps1 `
            -ArduinoDataDirectory `
              (Join-Path $env:RUNNER_TEMP "a/portable")

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: AZ3166-${{ steps.package.outputs.version }}-${{ matrix.artifact_suffix }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare Core packages
    needs: verify
    runs-on: ubuntu-24.04

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: AZ3166-*
          path: ${{ runner.temp }}/packages

      - name: Require byte-for-byte equality
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "packages") `
              -Filter "AZ3166-*.zip" -File -Recurse
          )
          if ($packages.Count -ne 2) {
            throw "Expected two platform packages, found $($packages.Count)."
          }

          $results = @($packages | ForEach-Object {
            [pscustomobject]@{
              Path = $_.FullName
              Size = $_.Length
              SHA256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $results | Format-Table -AutoSize

          if (@($results.Size | Sort-Object -Unique).Count -ne 1 -or
              @($results.SHA256 | Sort-Object -Unique).Count -ne 1) {
            throw "Windows and Ubuntu packages are not byte-for-byte identical."
          }
