name: Core package CI

on:
  pull_request:
    branches:
      - maintenance
  push:
    branches:
      - maintenance
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Immutable revision to validate for a release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Core package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-24.04
            artifact_suffix: ubuntu
          - name: Windows
            runner: windows-2022
            artifact_suffix: windows
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}

      - name: Read pinned build configuration
        id: build-lock
        shell: pwsh
        run: |
          . ./tools/build/Az3166Build.Common.ps1
          $lock = Get-Az3166BuildLock
          Export-Az3166BuildLockGitHubOutput `
            -Lock $lock -Path $env:GITHUB_OUTPUT

      - name: Validate build configuration
        shell: pwsh
        run: ./tests/host/build/BuildConfigurationTest.ps1

      - name: Validate build evidence contracts
        shell: pwsh
        run: ./tests/host/build/BuildEvidenceTest.ps1

      - name: Validate compiler parameter contracts
        shell: pwsh
        run: ./tests/host/build/CompilerParametersTest.ps1

      - name: Validate warning policy contracts
        shell: pwsh
        run: ./tests/host/build/WarningPolicyTest.ps1

      - name: Validate toolchain installer contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/host/build/ToolchainInstallerTest.ps1

      - name: Validate package layout contracts
        shell: pwsh
        run: ./tests/host/package/PackageLayoutTest.ps1

      - name: Validate release profile contracts
        shell: pwsh
        run: ./tests/host/package/ReleaseProfileTest.ps1

      - name: Cache AZ3166 toolchain downloads
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/az3166-downloads
          key: az3166-build-downloads-${{ hashFiles('tools/build/az3166-build-lock.json', 'tools/build/Install-Az3166BuildTools.ps1', 'tools/build/Az3166Build.Common.ps1', 'tools/package/Az3166PackageLayout.ps1', 'tools/package/Az3166PackageProfiles.ps1') }}-windows

      - name: Install pinned AZ3166 test toolchain
        if: runner.os == 'Windows'
        id: build-tools
        shell: pwsh
        run: |
          $arguments = @{
            Root = Join-Path $env:RUNNER_TEMP '${{ steps.build-lock.outputs.short_toolchain_root_name }}'
            DownloadCache = Join-Path $env:RUNNER_TEMP "az3166-downloads"
          }
          $tools = & ./tools/build/Install-Az3166BuildTools.ps1 @arguments
          $second = & ./tools/build/Install-Az3166BuildTools.ps1 @arguments -Offline
          $null = & ./tools/build/Install-Az3166BuildTools.ps1 @arguments -VerifyOnly
          if ($second.Changed) {
            throw "The second toolchain setup modified the installation."
          }
          "arduino_cli=$($tools.ArduinoCliPath)" >> $env:GITHUB_OUTPUT
          "arduino_data=$($tools.ArduinoDataDirectory)" >> $env:GITHUB_OUTPUT
          "arduino_unit=$($tools.ArduinoUnitDirectory)" >> $env:GITHUB_OUTPUT
          . ./tools/build/Az3166Build.Common.ps1
          $lock = Get-Az3166BuildLock
          $bin = Join-Path $tools.ArduinoDataDirectory "packages/AZ3166/tools/$($lock.tools.armNoneEabiGcc.packageName)/$($lock.tools.armNoneEabiGcc.version)/bin"
          "AZ3166_AR=$bin/arm-none-eabi-ar.exe" >> $env:GITHUB_ENV
          "AZ3166_NM=$bin/arm-none-eabi-nm.exe" >> $env:GITHUB_ENV

      - name: Select Linux archive tools
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          "AZ3166_AR=$(@(Get-Command ar -CommandType Application -ErrorAction Stop)[0].Source)" >> $env:GITHUB_ENV
          "AZ3166_NM=$(@(Get-Command nm -CommandType Application -ErrorAction Stop)[0].Source)" >> $env:GITHUB_ENV

      - name: Validate archive partition and immutable profile contracts
        shell: pwsh
        run: ./tests/host/package/AzureArchiveTest.ps1 -Ar $env:AZ3166_AR -Nm $env:AZ3166_NM

      - name: Build and verify deterministic package
        id: package
        shell: pwsh
        env:
          TZ: Pacific/Honolulu
        run: |
          git config core.autocrlf true
          $callerTimezone = $env:TZ
          foreach ($profile in @('base', 'azure-iot')) {
            $result = & ./tools/package/Test-Az3166BoardPackage.ps1 `
              -Profile $profile -Ar $env:AZ3166_AR -Nm $env:AZ3166_NM `
              -OutputDirectory (Join-Path $env:RUNNER_TEMP "package")
            $result | Format-List
          }
          if ($env:TZ -ne $callerTimezone) {
            throw "Package builder did not restore the caller timezone."
          }
          if ((git config --get core.autocrlf) -ne "true") {
            throw "Package builder modified the caller Git configuration."
          }
          "path=$(Join-Path $env:RUNNER_TEMP 'package/*.zip')" >> $env:GITHUB_OUTPUT
          "version=$($result.Version)" >> $env:GITHUB_OUTPUT
          $result | Format-List

      - name: Verify canonical Core package
        shell: pwsh
        env:
          TZ: Pacific/Honolulu
          GOLDEN_VERSION: ${{ steps.build-lock.outputs.core_version }}
          GOLDEN_SIZE: ${{ steps.build-lock.outputs.core_package_size }}
          GOLDEN_SHA256: ${{ steps.build-lock.outputs.core_package_sha256 }}
        run: |
          $result = & ./tools/package/Test-Az3166BoardPackage.ps1 `
            -Revision $env:GOLDEN_VERSION `
            -ExpectedVersion $env:GOLDEN_VERSION `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "golden-package")
          if (
            $result.Size -ne [long]$env:GOLDEN_SIZE -or
            $result.SHA256 -ne $env:GOLDEN_SHA256
          ) {
            throw "Canonical $env:GOLDEN_VERSION package mismatch: $($result.Size) bytes, $($result.SHA256)"
          }
          $result | Format-List

      - name: Run Core host tests
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          foreach ($profile in @('base', 'azure-iot')) {
            ./tools/test/Test-Az3166HostTests.ps1 -Sanitize -Profile $profile `
              -ExpectedVersion '${{ steps.package.outputs.version }}'
          }

      - name: Compile Arduino test sketches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failures = @()
          foreach ($profile in @('base', 'azure-iot')) {
            try {
              ./tools/test/Test-Az3166Sketches.ps1 -Profile $profile `
                -ArduinoCli '${{ steps.build-tools.outputs.arduino_cli }}' `
                -ArduinoDataDirectory '${{ steps.build-tools.outputs.arduino_data }}' `
                -ArduinoUnitDirectory '${{ steps.build-tools.outputs.arduino_unit }}' `
                -OutputDirectory (Join-Path $env:RUNNER_TEMP "az3166-build-evidence/$profile")
            }
            catch { $failures += "$profile`: $($_.Exception.Message)" }
          }
          if ($failures.Count) { throw ($failures -join "`n") }

      - name: Validate failed-build evidence
        if: always() && runner.os == 'Windows' && steps.build-tools.outcome == 'success'
        shell: pwsh
        run: |
          ./tests/host/build/BuildEvidenceTest.ps1 `
            -ArduinoCli '${{ steps.build-tools.outputs.arduino_cli }}' `
            -ArduinoDataDirectory '${{ steps.build-tools.outputs.arduino_data }}' `
            -ArduinoUnitDirectory '${{ steps.build-tools.outputs.arduino_unit }}' `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'az3166-build-evidence/failure-fixtures')

      - name: Upload complete build evidence
        if: always() && runner.os == 'Windows'
        id: build-evidence
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/az3166-build-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize sketch build evidence
        if: always() && runner.os == 'Windows' && steps.build-evidence.outputs.artifact-url != ''
        shell: pwsh
        env:
          BUILD_EVIDENCE_URL: ${{ steps.build-evidence.outputs.artifact-url }}
        run: |
          . ./tools/test/Az3166BuildEvidence.ps1
          foreach ($profile in @('base', 'azure-iot', 'failure-fixtures')) {
            $directory = Join-Path $env:RUNNER_TEMP "az3166-build-evidence/$profile"
            "### $profile" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Get-Az3166EvidenceSummary -OutputDirectory $directory `
              -ArtifactRootDirectory (Join-Path $env:RUNNER_TEMP 'az3166-build-evidence') `
              -ArtifactUrl $env:BUILD_EVIDENCE_URL |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $warningSummary = Join-Path $directory 'warning-summary.md'
            if (Test-Path -LiteralPath $warningSummary) {
              Get-Content -LiteralPath $warningSummary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            }
          }

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: AZ3166-${{ steps.package.outputs.version }}-${{ matrix.artifact_suffix }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare Core packages
    needs: verify
    runs-on: ubuntu-24.04

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: AZ3166-*
          path: ${{ runner.temp }}/packages

      - name: Require byte-for-byte equality
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "packages") `
              -Filter "AZ3166-*.zip" -File -Recurse
          )
          if ($packages.Count -ne 4) {
            throw "Expected two profiles from both hosts, found $($packages.Count) packages."
          }

          $results = @($packages | ForEach-Object {
            [pscustomobject]@{
              Path = $_.FullName
              Size = $_.Length
              SHA256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $results | Format-Table -AutoSize

          foreach ($profile in @('base', 'azure-iot')) {
            $pair = @($results | Where-Object { $_.Path.EndsWith("-$profile.zip", [StringComparison]::Ordinal) })
            if ($pair.Count -ne 2 -or @($pair.Size | Sort-Object -Unique).Count -ne 1 -or
                @($pair.SHA256 | Sort-Object -Unique).Count -ne 1) {
              throw "Windows and Ubuntu $profile packages are not byte-for-byte identical."
            }
          }
